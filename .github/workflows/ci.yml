name: build

# Every push to main builds zevic on Linux, macOS and Windows, runs the tests and,
# when all three succeed, publishes the executables as a GitHub release.
# Pushing a tag like v0.1.0 publishes a normal (non-pre-release) release instead.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, exe: "", archive: tar.gz }
          - { name: macos-arm64, os: macos-latest, exe: "", archive: tar.gz }
          - { name: windows-x64, os: windows-latest, exe: ".exe", archive: zip }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # zevic turns Zevic into LLVM IR and asks clang (15 or newer) to build it.
      - name: Install LLVM (Linux, apt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: clang --version
      - name: Install LLVM (Windows, winget)
        if: runner.os == 'Windows'
        run: |
          if ! command -v clang >/dev/null 2>&1 && [ ! -x "/c/Program Files/LLVM/bin/clang.exe" ]; then
            winget install --id LLVM.LLVM -e --silent --accept-package-agreements --accept-source-agreements
          fi
          echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
      - name: Show clang version
        run: clang --version

      # the seed compiler comes from the committed LLVM IR with clang alone; it builds the compiler from its sources
      - name: Build zevic
        run: |
          E="${{ matrix.exe }}"
          VERSION="$(cat VERSION)"
          export ZEVIC_HOME="$PWD"
          SRC=$(ls tools/zevic1/src/*.zev | sort)
          grep -q "\"$VERSION\"" tools/zevic1/src/Version.zev
          grep -q "\"$VERSION\"" tools/zevpm/src/Version.zev
          grep -q "^version = \"$VERSION\"" packages/Zevic/zevic.toml
          mkdir -p build
          sh tools/bootstrap-build.sh "build/zevic-seed$E"
          "build/zevic-seed$E" $SRC -o "build/zevic$E"
          "build/zevic$E" --version
          "build/zevic$E" tools/zevpm/src/*.zev -o "build/zevpm$E"
          "build/zevpm$E" --version
          "build/zevic$E" tools/zevfmt/src/*.zev -o "build/zevfmt$E"
          # the test runner is C
          if [ "${{ runner.os }}" = "Windows" ]; then PTHREAD=""; else PTHREAD="-pthread"; fi
          clang -std=c11 -O1 -Wall -Wextra -Wno-unused-parameter -Wno-unused-function $PTHREAD tests/zevtest.c -o "build/zevtest$E"

      - name: Test
        run: |
          export ZEVIC="build/zevic${{ matrix.exe }}" ZEVPM="build/zevpm${{ matrix.exe }}" ZEVFMT="build/zevfmt${{ matrix.exe }}"
          T="build/zevtest${{ matrix.exe }}"
          "$T" golden
          "$T" zevpm
          "$T" examples
          "$T" zevfmt
          "$T" install
          "build/zevfmt${{ matrix.exe }}" -check packages examples tools

      # the fixed point: the compiler built by the seed writes the IR the seed came from
      - name: Bootstrap check
        run: |
          E="${{ matrix.exe }}"
          SRC=$(ls tools/zevic1/src/*.zev | sort)
          "build/zevic$E" $SRC -o "build/zevic2$E"
          "build/zevic$E" --emit-ll $SRC -o build/zevic1.ll
          "build/zevic2$E" --emit-ll $SRC -o build/zevic2.ll
          cmp build/zevic1.ll build/zevic2.ll
          cmp build/zevic2.ll bootstrap/zevic.ll

      - name: Package
        id: pkg
        run: |
          VERSION="$(cat VERSION)"
          NAME="zevic-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/$NAME/bin" dist/extra
          cp "build/zevic${{ matrix.exe }}" "build/zevpm${{ matrix.exe }}" "build/zevfmt${{ matrix.exe }}" "dist/$NAME/bin/"
          cp -r packages runtime examples "dist/$NAME/"
          cp LICENSE README.md CHANGELOG.md VERSION "dist/$NAME/"
          if [ "${{ runner.os }}" = "Windows" ]; then cp packaging/install.ps1 "dist/$NAME/"; else cp packaging/install.sh "dist/$NAME/"; fi
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$NAME.zip" "$NAME" >/dev/null
            echo "file=dist/$NAME.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$NAME.tar.gz" "$NAME"
            echo "file=dist/$NAME.tar.gz" >> "$GITHUB_OUTPUT"
          fi
          # native packages
          cd ..
          if [ "${{ runner.os }}" = "Linux" ]; then
            sh packaging/make-deb.sh "dist/$NAME" dist/extra
            cp packaging/install.sh packaging/install.ps1 dist/extra/
          elif [ "${{ runner.os }}" = "macOS" ]; then
            sh packaging/make-pkg.sh "dist/$NAME" dist/extra
          fi
          cp "dist/$NAME".* dist/extra/
          ls -l dist dist/extra

      - name: Smoke test the package
        run: |
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then 7z x -y *.zip >/dev/null; else tar -xzf *.tar.gz; fi
          PKG="$(pwd)/zevic-$(cat ../VERSION)-${{ matrix.name }}"
          # the way a user works: only bin is on PATH, and the work happens somewhere else
          export PATH="$PKG/bin:$PATH"
          unset ZEVIC ZEVIC_HOME ZEVPM ZEVFMT
          mkdir -p "$RUNNER_TEMP/smoke work"
          cd "$RUNNER_TEMP/smoke work"
          zevic --version
          zevpm --version
          zevic "$PKG/examples/01_hello.zev" -o hello${{ matrix.exe }}
          ./hello${{ matrix.exe }}
          zevpm new smoke
          cd smoke
          zevpm run
          zevpm test
          zevfmt -check src/Main.zev

      # the installers: install somewhere with a space in the path, then use the installed copy only
      - name: Smoke test the installer (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          PKG="$(pwd)/dist/zevic-$(cat VERSION)-${{ matrix.name }}"
          sh "$PKG/install.sh" --prefix "$RUNNER_TEMP/inst prefix"
          export PATH="$RUNNER_TEMP/inst prefix/bin:$PATH"
          unset ZEVIC ZEVIC_HOME ZEVPM ZEVFMT
          mkdir -p "$RUNNER_TEMP/inst work" && cd "$RUNNER_TEMP/inst work"
          zevic --version
          zevic "$PKG/examples/01_hello.zev" -o hello && ./hello
          zevpm new app && cd app && zevpm run && zevpm test
          sh "$PKG/install.sh" --uninstall --prefix "$RUNNER_TEMP/inst prefix"
          test ! -e "$RUNNER_TEMP/inst prefix/bin/zevic"
      - name: Smoke test the installer (Windows)
        if: runner.os == 'Windows'
        run: |
          PKG="$(pwd)/dist/zevic-$(cat VERSION)-${{ matrix.name }}"
          WPKG="$(cygpath -w "$PKG")"
          PREFIX="$(cygpath -w "$RUNNER_TEMP")\\inst prefix"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$WPKG\\install.ps1" -Prefix "$PREFIX"
          export PATH="$(cygpath -u "$PREFIX")/bin:$PATH"
          unset ZEVIC ZEVIC_HOME ZEVPM ZEVFMT
          mkdir -p "$RUNNER_TEMP/inst work" && cd "$RUNNER_TEMP/inst work"
          zevic --version
          zevic "$PKG/examples/01_hello.zev" -o hello.exe && ./hello.exe
          zevpm new app && cd app && zevpm run && zevpm test
          powershell -NoProfile -ExecutionPolicy Bypass -File "$WPKG\\install.ps1" -Uninstall -Prefix "$PREFIX"
      - name: Smoke test the .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/extra/zevic_*.deb
          unset ZEVIC ZEVIC_HOME ZEVPM ZEVFMT
          mkdir -p "$RUNNER_TEMP/deb work" && cd "$RUNNER_TEMP/deb work"
          command -v zevic
          zevic --version
          zevic "$GITHUB_WORKSPACE/examples/01_hello.zev" -o hello && ./hello
          zevpm new app && cd app && zevpm run && zevpm test
          sudo apt-get remove -y zevic
          hash -r
          ! command -v zevic
      - name: Smoke test the .pkg (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo installer -pkg dist/extra/zevic-*.pkg -target /
          unset ZEVIC ZEVIC_HOME ZEVPM ZEVFMT
          mkdir -p "$RUNNER_TEMP/pkg work" && cd "$RUNNER_TEMP/pkg work"
          /usr/local/bin/zevic --version
          /usr/local/bin/zevic "$GITHUB_WORKSPACE/examples/01_hello.zev" -o hello && ./hello
          export PATH="/usr/local/bin:$PATH"
          zevpm new app && cd app && zevpm run && zevpm test

      - uses: actions/upload-artifact@v4
        with:
          name: zevic-${{ matrix.name }}
          path: dist/extra/*
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Decide the release tag
        id: tag
        run: |
          VERSION="$(cat VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "name=v${VERSION}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes
        run: |
          ARGS="--tag ${{ steps.tag.outputs.name }}"
          if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then ARGS="$ARGS --prerelease"; fi
          mkdir -p build; cc -std=c11 -O1 tools/release_notes.c -o build/release_notes
          build/release_notes $ARGS --assets artifacts/* > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: zevic ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
