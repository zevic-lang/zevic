name: build

# Every push to main builds zevic on Linux, macOS and Windows, runs the tests and,
# when all three succeed, publishes the executables as a GitHub release.
# Pushing a tag like v0.1.0 publishes a normal (non-pre-release) release instead.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, exe: "", archive: tar.gz }
          - { name: macos-arm64, os: macos-latest, exe: "", archive: tar.gz }
          - { name: windows-x64, os: windows-latest, exe: ".exe", archive: zip }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # zevic turns Zevic into LLVM IR and asks clang (15 or newer) to build it.
      - name: Install LLVM (Linux, apt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: clang --version
      - name: Install LLVM (Windows, winget)
        if: runner.os == 'Windows'
        run: |
          if ! command -v clang >/dev/null 2>&1 && [ ! -x "/c/Program Files/LLVM/bin/clang.exe" ]; then
            winget install --id LLVM.LLVM -e --silent --accept-package-agreements --accept-source-agreements
          fi
          echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
      - name: Show clang version
        run: clang --version

      - name: Build zevic
        run: |
          mkdir -p build
          VERSION="$(cat VERSION)"
          clang -std=c11 -O2 -Wall -Wextra -Wno-unused-parameter -Wno-unused-function -DZEVIC_VERSION="\"$VERSION\"" zevic0/*.c -o "build/zevic${{ matrix.exe }}"
          # zevpm is written in Zevic (tools/zevpm); the C version (zevpm/) is the frozen one for bootstrapping
          clang -std=c11 -O2 -Wall -Wextra -Wno-unused-parameter -Wno-unused-function -DZEVPM_VERSION="\"$VERSION\"" zevpm/*.c zevic0/util.c -o "build/zevpm-c${{ matrix.exe }}"
          grep -q "\"$VERSION\"" tools/zevpm/src/Version.zev
          grep -q "^version = \"$VERSION\"" packages/Zevic/zevic.toml
          "build/zevic${{ matrix.exe }}" tools/zevpm/src/*.zev -o "build/zevpm${{ matrix.exe }}"
          "build/zevic${{ matrix.exe }}" --version
          "build/zevpm${{ matrix.exe }}" --version
          # zevfmt is written in Zevic too (tools/zevfmt)
          "build/zevic${{ matrix.exe }}" tools/zevfmt/src/*.zev -o "build/zevfmt${{ matrix.exe }}"
          # the test runner is C too
          if [ "${{ runner.os }}" = "Windows" ]; then PTHREAD=""; else PTHREAD="-pthread"; fi
          clang -std=c11 -O1 -Wall -Wextra -Wno-unused-parameter -Wno-unused-function $PTHREAD tests/zevtest.c -o "build/zevtest${{ matrix.exe }}"

      - name: Test
        run: |
          export ZEVIC="build/zevic${{ matrix.exe }}" ZEVPM="build/zevpm${{ matrix.exe }}" ZEVFMT="build/zevfmt${{ matrix.exe }}"
          T="build/zevtest${{ matrix.exe }}"
          "$T" golden
          "$T" zevpm
          ZEVPM="build/zevpm-c${{ matrix.exe }}" "$T" zevpm
          "$T" examples
          "$T" zevfmt
          "$T" install
          "build/zevfmt${{ matrix.exe }}" -check packages examples tools

      - name: Package
        id: pkg
        run: |
          VERSION="$(cat VERSION)"
          NAME="zevic-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/$NAME/bin"
          cp "build/zevic${{ matrix.exe }}" "build/zevpm${{ matrix.exe }}" "build/zevfmt${{ matrix.exe }}" "dist/$NAME/bin/"
          cp -r packages runtime examples "dist/$NAME/"
          cp LICENSE README.md CHANGELOG.md VERSION "dist/$NAME/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$NAME.zip" "$NAME" >/dev/null
            echo "file=dist/$NAME.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$NAME.tar.gz" "$NAME"
            echo "file=dist/$NAME.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke test the package
        run: |
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then 7z x -y *.zip >/dev/null; else tar -xzf *.tar.gz; fi
          PKG="$(pwd)/zevic-$(cat ../VERSION)-${{ matrix.name }}"
          # the way a user works: only bin is on PATH, and the work happens somewhere else
          export PATH="$PKG/bin:$PATH"
          unset ZEVIC ZEVIC_HOME ZEVPM ZEVFMT
          mkdir -p "$RUNNER_TEMP/smoke work"
          cd "$RUNNER_TEMP/smoke work"
          zevic --version
          zevpm --version
          zevic "$PKG/examples/01_hello.zev" -o hello${{ matrix.exe }}
          ./hello${{ matrix.exe }}
          zevpm new smoke
          cd smoke
          zevpm run
          zevpm test
          zevfmt -check src/Main.zev

      - uses: actions/upload-artifact@v4
        with:
          name: zevic-${{ matrix.name }}
          path: ${{ steps.pkg.outputs.file }}
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Decide the release tag
        id: tag
        run: |
          VERSION="$(cat VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "name=v${VERSION}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes
        run: |
          ARGS="--tag ${{ steps.tag.outputs.name }}"
          if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then ARGS="$ARGS --prerelease"; fi
          python3 tools/release_notes.py $ARGS > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: zevic ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
